<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dhikzx Cloud — Order</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  body { background:#0f172a; color:#e2e8f0; font-family:'Poppins', sans-serif; }
  
  /* Styling Kartu Paket */
  .paket-card { 
      background: #1e293b; 
      border: 2px solid transparent; 
      border-radius: 1rem; 
      padding: 1.25rem; 
      margin-bottom: 1rem; 
      cursor: pointer; 
      transition: all 0.2s;
  }
  .paket-card:hover { transform: translateY(-2px); border-color: #334155; }
  .paket-card.active { border-color: #10b981; background: #1e293b; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
  
  /* Input Custom */
  .custom-input { background: #0f172a; border: 1px solid #334155; color: white; transition: border-color 0.3s; }
  .custom-input:focus { outline: none; border-color: #10b981; }

  /* MODAL HISTORY MODERN STYLE */
  .modal-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.7); 
      backdrop-filter: blur(12px); /* Blur Background Parah Biar Estetik */
      z-index: 100; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      opacity: 0; 
      pointer-events: none; 
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .history-container {
      background: rgba(30, 41, 59, 0.95);
      width: 90%;
      max-width: 500px;
      border-radius: 2rem;
      padding: 2rem;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: scale(0.9);
      transition: all 0.3s ease;
  }
  .modal-overlay.show .history-container { transform: scale(1); }

  .custom-scrollbar::-webkit-scrollbar { width: 5px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

  /* UI Sidebar & Lainnya */
  .sidebar-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 80%; max-width: 300px; background: #10172a; z-index: 60; transform: translateX(-100%); transition: transform 0.3s ease-out; padding: 1.5rem; }
  .sidebar-menu.show { transform: translateX(0); }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 59; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body class="min-h-screen pb-24">

  <div id="sidebar_overlay" class="sidebar-overlay"></div>
  
  <div id="sidebar_menu" class="sidebar-menu">
      <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-700">
        <h3 class="text-xl font-bold text-emerald-400">Menu Utama</h3>
        <button id="close_sidebar" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav class="space-y-3">
          <a href="#" onclick="location.reload()" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition-colors">
              <i class="fa-solid fa-house text-emerald-400"></i><span>Beranda</span>
          </a>
          <a href="#" onclick="openHistoryModal()" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition-colors">
              <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i><span>Cek Riwayat</span>
          </a>
      </nav>
  </div>

  <div class="bg-[#1e293b] p-4 shadow-md sticky top-0 z-10 border-b border-slate-700 flex items-center justify-between">
    <div id="btn_open_sidebar" class="flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 bg-emerald-600 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-server text-white"></i>
        </div>
        <h1 class="text-lg font-bold text-white leading-none">DhikzxHost</h1>
    </div>
    <button onclick="openHistoryModal()" class="w-10 h-10 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center hover:bg-slate-700 transition-all">
        <i class="fa-solid fa-history text-emerald-400"></i>
    </button>
  </div> 

  <div class="max-w-md mx-auto p-5">
    <div class="mb-8">
        <label class="block text-slate-400 text-xs mb-2 ml-1 uppercase font-bold tracking-wider">Username Panel</label>
        <input type="text" id="inp_user" placeholder="dhikz123" class="w-full custom-input rounded-xl p-4 text-sm font-medium">
    </div>
    <div class="mb-8">
        <label class="block text-slate-400 text-xs mb-2 ml-1 uppercase font-bold tracking-wider">Password Panel</label>
        <input type="text" id="inp_pass" placeholder="******" class="w-full custom-input rounded-xl p-4 text-sm font-medium">
    </div>
    <div id="list_paket"></div>
  </div>

  <div class="fixed bottom-0 left-0 right-0 p-4 bg-[#1e293b]/80 backdrop-blur-md border-t border-slate-700">
    <div class="max-w-md mx-auto">
        <button id="btn_buy" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl transition-all opacity-50 shadow-lg" disabled>
            Isi Data Terlebih Dahulu
        </button>
    </div>
  </div>

  <div id="modal_history" class="modal-overlay">
    <div class="history-container">
      <div class="flex justify-between items-start mb-6">
        <div>
          <h3 class="text-2xl font-extrabold text-white">Riwayat</h3>
          <p class="text-xs text-slate-400">Panel yang pernah kamu beli</p>
        </div>
        <button id="close_history" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-all">
          <i class="fa-solid fa-xmark"></i>
        </button> 
      </div>
      
      <div class="relative mb-6">
          <input type="text" id="hist_username" placeholder="Cari username..." class="w-full bg-slate-900 border border-slate-700 text-white rounded-2xl p-4 text-sm focus:border-emerald-500 outline-none transition-all pl-12">
          <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <button onclick="checkMyHistory()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-xl text-[10px] font-bold">CARI</button>
      </div>

      <div id="hist_body" class="overflow-y-auto pr-2 custom-scrollbar space-y-4">
          <div class="py-20 text-center text-slate-600 text-sm italic">Belum ada riwayat transaksi.</div>
      </div>
      
      <div class="mt-6 pt-4 border-t border-slate-800 text-center">
        <p class="text-[10px] text-slate-500 italic">Data ini disimpan secara lokal di browser kamu.</p>
      </div>
    </div>
  </div>

  <div id="modal_qr" class="modal-overlay">
      <div class="bg-[#1e293b] p-6 rounded-3xl text-center max-w-sm w-full mx-4 border border-slate-700">
          <h3 class="text-white font-bold mb-4 text-xl">Scan QRIS</h3>
          <div class="bg-white p-3 rounded-2xl inline-block mb-4"><img id="img_qr" src="" width="200"></div>
          <p id="qr_timer" class="text-emerald-400 font-mono text-2xl font-bold mb-4">05:00</p>
          <button id="close_qr" class="text-slate-500 text-sm">Batalkan</button>
      </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
