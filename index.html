<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dhikzx Cloud — Order</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  body { background:#0f172a; color:#e2e8f0; font-family:'Poppins', sans-serif; }
  
  .paket-card { background: #1e293b; border: 2px solid transparent; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s; position: relative; }
  .paket-card:hover { transform: translateY(-2px); border-color: #334155; }
  .paket-card.active { border-color: #10b981; background: #1e293b; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
  
  .custom-input { background: #0f172a; border: 1px solid #334155; color: white; transition: border-color 0.3s; }
  .custom-input:focus { outline: none; border-color: #10b981; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 50; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: all 0.3s ease; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

  .sidebar-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 80%; max-width: 300px; background: #10172a; z-index: 60; transform: translateX(-100%); transition: transform 0.3s ease-out; padding: 1.5rem; }
  .sidebar-menu.show { transform: translateX(0); }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 59; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body class="min-h-screen pb-24">

  <div id="sidebar_overlay" class="sidebar-overlay"></div>
  <div id="sidebar_menu" class="sidebar-menu">
      <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-700">
        <h3 class="text-xl font-bold text-emerald-400">Menu</h3>
        <button id="close_sidebar" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav class="space-y-3">
          <a href="#" onclick="location.reload()" class="flex items-center gap-3 p-3 rounded-lg bg-slate-700/50"><i class="fa-solid fa-house text-emerald-400"></i> Beranda</a>
          <a href="#" onclick="openHistoryModal()" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700"><i class="fa-solid fa-clock-rotate-left text-emerald-400"></i> Riwayat</a>
      </nav>
  </div>

  <div class="bg-[#1e293b] p-4 shadow-md sticky top-0 z-10 border-b border-slate-700 flex items-center justify-between">
    <div id="btn_open_sidebar" class="flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 bg-emerald-600 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-server text-white"></i>
        </div>
        <div>
            <h1 class="text-lg font-bold text-white">DhikzxHost</h1>
            <p class="text-[10px] text-slate-400">Cloud Infrastructure</p>
        </div>
    </div>
    <div class="flex gap-2">
        <button onclick="openHistoryModal()" class="w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center border border-slate-700 hover:bg-slate-700">
            <i class="fa-solid fa-history text-emerald-400"></i>
        </button>
        <button id="btn_user_profile" class="w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center border border-slate-700">
            <i class="fa-solid fa-user text-slate-400"></i>
        </button>
    </div>
  </div> 

  <div class="max-w-md mx-auto p-5">
    <div class="mb-8">
        <h3 class="text-emerald-400 font-semibold mb-4 text-sm flex items-center gap-2">
            <i class="fa-solid fa-user-shield"></i> INFORMASI PANEL
        </h3>
        <div class="space-y-4">
            <input type="text" id="inp_user" maxlength="22" placeholder="Username Panel" class="w-full custom-input rounded-xl p-4 text-sm">
            <input type="text" id="inp_pass" maxlength="10" placeholder="Password Panel" class="w-full custom-input rounded-xl p-4 text-sm">
        </div>
    </div>
    <div>
        <h3 class="text-emerald-400 font-semibold mb-4 text-sm flex items-center gap-2">
            <i class="fa-solid fa-layer-group"></i> PILIH PAKET
        </h3>
        <div id="list_paket"></div>
    </div>
  </div>

  <div class="fixed bottom-0 left-0 right-0 p-4 bg-[#0f172a]/80 backdrop-blur-md border-t border-slate-800">
    <div class="max-w-md mx-auto">
        <button id="btn_buy" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl transition-all opacity-50 shadow-lg" disabled>
            Pilih Paket & Isi Data
        </button>
    </div>
  </div>

  <div id="modal_history" class="modal-overlay">
    <div class="bg-[#1e293b]/90 w-full max-w-lg rounded-[2.5rem] p-8 mx-4 border border-white/10 shadow-2xl relative flex flex-col max-h-[80vh]">
      <button id="close_history" class="absolute top-6 right-6 text-slate-500"><i class="fa-solid fa-circle-xmark text-2xl"></i></button> 
      <h3 class="text-2xl font-bold text-white mb-1">Riwayat Kamu</h3>
      <p class="text-xs text-slate-400 mb-6">Kelola akun panel yang sudah aktif</p>
      
      <div class="relative mb-6">
          <input type="text" id="hist_username" placeholder="Cari username..." class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl p-4 pl-12 text-sm outline-none focus:border-emerald-500">
          <i class="fa-solid fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <button onclick="checkMyHistory()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-emerald-600 text-[10px] font-bold px-4 py-2 rounded-xl">CEK</button>
      </div>

      <div id="hist_body" class="overflow-y-auto pr-2 custom-scrollbar space-y-4">
          </div>
    </div>
  </div>

  <div id="modal_qr" class="modal-overlay">
    <div class="bg-[#1e293b] w-full max-w-sm rounded-3xl p-6 text-center mx-4 border border-slate-700">
      <h3 class="text-white font-bold mb-4">Pembayaran QRIS</h3>
      <div class="bg-white p-3 rounded-2xl inline-block mb-4">
        <img id="img_qr" src="" width="220" class="rounded-lg">
      </div>
      <p id="qr_timer" class="text-emerald-400 font-mono font-bold text-xl mb-6">5m 0s</p>
      <div class="bg-slate-900 p-4 rounded-2xl text-left text-xs space-y-3 border border-slate-800">
        <div class="flex justify-between border-b border-slate-800 pb-2">
            <span class="text-slate-500">Item</span>
            <span id="det_item" class="text-white font-bold">...</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-500">Harga</span>
            <span id="det_price" class="text-emerald-400 font-bold">...</span>
        </div>
      </div>
      <button id="close_qr" class="mt-6 text-slate-500 text-xs hover:text-white">Batalkan Pesanan</button>
    </div>
  </div>

  <div id="modal_success" class="modal-overlay">
    <div class="bg-[#1e293b] w-full max-w-sm rounded-3xl p-8 mx-4 text-center border border-slate-700 shadow-2xl">
      <div class="w-20 h-20 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fa-solid fa-check text-4xl text-emerald-500"></i>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">Berhasil!</h2>
      <p class="text-slate-400 text-sm mb-6">Panel Anda sudah siap digunakan.</p>
      <div class="bg-slate-900 p-4 rounded-2xl text-left space-y-3 mb-6 font-mono text-xs">
         <div><span class="text-slate-500">USER:</span> <span id="res_user" class="text-white"></span></div>
         <div><span class="text-slate-500">PASS:</span> <span id="res_pass" class="text-white"></span></div>
         <div class="truncate"><span class="text-slate-500">URL:</span> <span id="res_url" class="text-emerald-400"></span></div>
      </div>
      <button id="btn_copy_all" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold">Copy Data Panel</button>
      <button onclick="location.reload()" class="mt-4 text-slate-500 text-xs">Tutup</button>
    </div>
  </div>

  <div id="modal_error_user" class="modal-overlay">
    <div class="bg-[#1e293b] w-full max-w-sm rounded-3xl p-8 mx-4 text-center border border-slate-700">
      <i class="fa-solid fa-triangle-exclamation text-4xl text-rose-500 mb-4"></i>
      <h2 class="text-xl font-bold text-white mb-2">Username Terpakai</h2>
      <p id="error_user_msg" class="text-slate-400 text-sm mb-6"></p>
      <button onclick="document.getElementById('modal_error_user').classList.remove('show')" class="w-full bg-rose-600 py-3 rounded-xl font-bold">Ganti Nama</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
